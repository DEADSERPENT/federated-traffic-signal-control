# Federated Learning-based Adaptive Traffic Signal Control System
# Configuration File

# Traffic Simulation Settings
traffic:
  num_intersections: 4
  simulation_duration: 3600  # seconds (1 hour)
  time_step: 5  # seconds

  # Vehicle arrival parameters
  arrival_distribution: "poisson"  # "poisson" or "uniform"
  min_arrival_rate: 5  # vehicles per minute
  max_arrival_rate: 30  # vehicles per minute

  # Queue parameters
  max_queue_length: 50

  # Signal parameters
  min_green_duration: 20  # seconds — reduces yellow-light jitter overhead
  max_green_duration: 90  # seconds
  yellow_duration: 3  # seconds

# Federated Learning Settings (Optimized for 5-Way Victory)
federated_learning:
  num_rounds: 150          # Deep convergence
  local_epochs: 5          # Reduced to prevent Non-IID drift (FedProx-optimal)
  batch_size: 32
  learning_rate: 0.001
  lr_decay: 0.995          # Slower decay — more refinement in later rounds
  weight_decay: 0.0001     # L2 regularization
  min_lr: 0.0001

  # FedProx proximal term — lower value lets local models adapt to intersection-specific patterns
  mu: 0.01

  # Server aggregation: trimmed_mean balances performance and robustness
  strategy: "trimmed_mean"
  trim_ratio: 0.1          # Remove top/bottom 10% outliers before averaging

  # Server settings
  server_address: "localhost:8080"
  min_clients: 2
  fraction_fit: 1.0
  fraction_evaluate: 1.0

  # Early stopping
  patience: 30             # Extended to allow deeper convergence past round 50

# Model Settings (Temporal-Aware LSTM Architecture)
model:
  type: "lstm"             # LSTM captures temporal platoon dynamics (beats Actuated)
  hidden_dim: 128
  num_layers: 2
  activation: "leaky_relu"
  output_activation: "linear"
  use_batch_norm: true
  dropout_rate: 0.15       # Higher dropout for better generalization

# Network Simulation Settings
network:
  base_latency: 10  # milliseconds
  bandwidth: 100  # Mbps
  packet_loss_probability: 0.01
  jitter_range: 5  # milliseconds

# CloudSim Settings
cloudsim:
  edge_vm_mips: 1000
  edge_vm_ram: 512  # MB
  edge_vm_bandwidth: 1000  # Mbps

  cloud_datacenter_hosts: 4
  cloud_host_mips: 10000
  cloud_host_ram: 8192  # MB

# Output Settings
output:
  save_metrics: true
  save_models: true
  visualization: true
  results_dir: "results"
